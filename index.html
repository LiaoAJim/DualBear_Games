<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DualBear Games - 聚會與休閒遊戲大廳</title>
  <meta name="description" content="DualBear 跨平台聚會遊戲平台，桌機手機即開即玩，支援破冰、桌遊、趣味對決！">
  <link rel="stylesheet" href="css/hub.css?v=1.1.0">
</head>
<body>
  <!-- 頂部品牌列 -->
  <header class="main-header">
    <div class="header-container">
      <div class="brand-box">
        <span class="brand-logo">🐻🎮</span>
        <div>
          <h1 class="brand-title">DualBear Games</h1>
          <p class="brand-sub">跨平台聚會與破冰遊戲大廳</p>
        </div>
      </div>
    </div>
  </header>

  <!-- 主視覺介紹區 -->
  <section class="hero-section">
    <h2 class="hero-title">聚會破冰，秒速破除尷尬</h2>
    <p class="hero-desc">免下載、零延遲、桌機與手機（Android / iOS）瀏覽器點開即玩！挑選一款遊戲，立即與身邊的朋友同樂。</p>
  </section>

  <!-- 分類導航 -->
  <nav class="filter-tabs-wrapper" aria-label="遊戲分類">
    <div class="filter-tabs" id="filterTabs">
      <!-- 由 hub.js 動態產出分類標籤 -->
    </div>
  </nav>

  <!-- 遊戲展示網格 -->
  <main class="games-main">
    <div class="games-grid" id="gamesGrid">
      <!-- 由 hub.js 動態掛載遊戲卡片 -->
    </div>
  </main>

  <!-- 頁腳 -->
  <footer class="main-footer">
    <p>© 2026 DualBear Games. 專案所有遊戲皆支援獨立運作與熱插拔上架。</p>
    <p class="footer-tip">💡 提示：將任何遵循獨立結構的遊戲資料夾放入 <code>/games/</code> 並登記於 <code>games-manifest.json</code> 即可自動上架！</p>
  </footer>

  <!-- 模組化入口 -->
  <script type="module" src="js/hub.js?v=1.2.0"></script>
</body>
</html>
